<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Project case study by Phoenix Eve Aspacio." />
    <link rel="icon" type="image/png" href="/favicon-blue.png" />
    <title>Project Case Study - Phoenix Eve Aspacio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#case-study">Skip to case study</a>
    <header class="site-header case-header">
      <a class="wordmark" href="/#top" aria-label="Phoenix Eve Aspacio, home">
        <img class="mark" src="/favicon-blue.png" alt="" aria-hidden="true" />
        <span>PHOENIX<br />ASPACIO</span>
      </a>
      <a class="case-back" href="/#work">← Selected experience</a>
      <p class="header-status"><span></span> Case study</p>
    </header>

    <main class="case-study-page" id="case-study">
      <p class="eyebrow" id="case-period"></p>
      <h1 id="case-title"></h1>
      <p class="case-role" id="case-role"></p>
      <p class="case-intro" id="case-intro"></p>

      <section class="case-grid" aria-label="Case-study details">
        <div class="case-label">PROJECT</div>
        <div><h2 id="case-project"></h2><p id="case-description"></p></div>

        <div class="case-label">CONTRIBUTION</div>
        <ul class="case-highlights" id="case-highlights"></ul>

        <div class="case-label">TOOLKIT</div>
        <div class="tag-list" id="case-technologies" aria-label="Technologies used"></div>
      </section>

      <section class="case-visuals" aria-labelledby="visuals-title">
        <div class="section-heading case-section-heading">
          <p class="eyebrow">PROJECT VISUALS</p>
          <h2 id="visuals-title">Selected<br />projects.</h2>
        </div>
        <div class="case-gallery" id="case-gallery"></div>
      </section>
    </main>
    <script src="/case-study.js"></script>
  </body>
</html>
